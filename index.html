<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <div class="page-background">
      <div class="card"></div>
        <div class="profile-picture-container">
          <img class="profile-picture" src="/assets/images/avatar-jessica.jpeg" alt="headshot of a lady">
        </div>
        <div class="copy">
          <h1>Jessica Randall</h1>
          <h2>London, United Kingdom</h2>
          <h3>"Front-end developer and avid reader."</h3>
        </div>
        <div class="button-container">
          <button class="social-button">GitHub</button>
          <button class="social-button">Frontend Mentor</button>
          <button class="social-button">LinkedIn</button>
          <button class="social-button">Twitter</button>
          <button class="social-button">Instagram</button>
        </div>
      </div>
    </div>
  </main>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Roulfe</a>.
  </div>
</body>
</html>
